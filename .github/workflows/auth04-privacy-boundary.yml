name: AUTH-04 privacy boundary (fictional offline tests)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and GAS syntax
        run: |
          python -m py_compile 01_registration_crf.py juog_common.py
          cp 05_registry_google_apps_script.gs /tmp/juog_auth04_syntax.js
          node --check /tmp/juog_auth04_syntax.js
      - name: Test forbidden identifiers, clinical allowlist and legacy readback
        run: node tests/test_auth04_privacy_guard.mjs
      - name: Real GAS API error boundary must not echo sensitive exception
        run: node tests/test_auth04_error_boundary.mjs
      - name: Actual GAS screening and CRF draft save-read tests (fictional Sheets)
        run: node tests/test_auth04_draft_end_to_end.mjs
      - name: Test screening draft DOB exclusion
        run: python -m unittest discover -s tests -p "test_auth04_screening_draft_privacy.py" -v
      - name: Existing screening identity tests
        run: node tests/test_screening_identity.mjs
