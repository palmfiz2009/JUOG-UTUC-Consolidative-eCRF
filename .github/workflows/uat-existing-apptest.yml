name: UAT existing Streamlit AppTest (offline, no browser)
on:
  push:
    branches:
      - uat-apptest-existing-source-20261110
    paths:
      - 'tests/test_existing_app_apptest.py'
      - '.github/workflows/uat-existing-apptest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-source-apptest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing application dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure non-networking CI-only dummy secrets
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml <<'EOF'
          [registry]
          url = "http://127.0.0.1:18791/"
          token = "LOCAL-UAT-APPTEST-NO-NETWORK"
          [admin]
          password = "OFFLINE-ADMIN-ONLY-NON-SECRET"
          [reviewer_passwords]
          radiology = "OFFLINE-RAD-NON-SECRET"
          medical_oncology = "OFFLINE-MO-NON-SECRET"
          urology = "OFFLINE-URO-NON-SECRET"
          EOF
      - name: Run simulated Streamlit UI checks against real source
        run: python tests/test_existing_app_apptest.py
      - name: Upload evidence JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-source-apptest-results
          path: tests/apptest-artifacts/app_test_results.json
          retention-days: 14
