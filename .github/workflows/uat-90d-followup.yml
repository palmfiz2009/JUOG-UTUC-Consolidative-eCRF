name: UAT 90-day and follow-up draft recovery

on:
  pull_request:
    paths:
      - '03_day90_crf.py'
      - '04_followup_crf.py'
      - 'juog_common.py'
      - 'tests/test_90d_followup_drafts.py'
      - '.github/workflows/uat-90d-followup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-widget-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify actual 90-day and follow-up draft restoration logic offline
        run: python -m unittest discover -s tests -p 'test_90d_followup_drafts.py' -v
