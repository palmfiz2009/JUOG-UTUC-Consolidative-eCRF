name: GCP CRF audit recovery (fictional offline evidence)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate actual GAS JS syntax
        run: |
          cp 05_registry_google_apps_script.gs /tmp/juog_gcp_audit_syntax.js
          node --check /tmp/juog_gcp_audit_syntax.js
      - name: Real GAS save/audit helpers against in-memory failure injection
        run: node tests/test_crf_audit_recovery.mjs
      - name: Existing screening ID regressions
        run: node tests/test_screening_identity.mjs
