name: UAT CRF audit recovery (offline)

on:
  pull_request:
    paths:
      - '05_registry_google_apps_script.gs'
      - 'tests/test_audit_recovery.cjs'
      - '.github/workflows/uat-audit-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify append-only, injected audit failure and idempotent retry
        run: node tests/test_audit_recovery.cjs
